services:
  dev:
    build:
      context: .
      dockerfile: docker/dev.Dockerfile
      args:
        USER_ID: ${HOST_UID:-1000}
        GROUP_ID: ${HOST_GID:-1000}
    image: hunk-converter-dev
    init: true
    working_dir: /workspace
    volumes:
      - .:/workspace
      - cargo-registry:/usr/local/cargo/registry
      - cargo-git:/usr/local/cargo/git
    stdin_open: true
    tty: true
    command: bash

volumes:
  cargo-registry:
  cargo-git:
